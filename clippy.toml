# Tests may unwrap and panic; production code may not (D-030).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
# Project and product names that are not code.
doc-valid-idents = ["OpenChef", "SQLite", "JSON-RPC", "TOML", "Seatbelt", "Landlock", "..", "macOS"]
