[package]
name = "openchef-cli"
description = "The openchef binary: command line, daemon entry and hidden helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "openchef_cli"
path = "src/lib.rs"

[[bin]]
name = "openchef"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
openchef-config.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
tempfile.workspace = true

[lints]
workspace = true
