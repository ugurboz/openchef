[package]
name = "openchef"
description = "The openchef binary: command line, daemon entry and hidden helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
name = "openchef_cli"
path = "src/lib.rs"

[[bin]]
name = "openchef"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
openchef-api.workspace = true
openchef-config.workspace = true
openchef-core.workspace = true
openchef-daemon.workspace = true
openchef-engine.workspace = true
openchef-quota.workspace = true
openchef-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "time", "macros"] }
tokio-util.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
openchef-fake.workspace = true
openchef-store.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.dist]
# Release packaging ships only the openchef binary (architecture §19, R8).
dist = true
